# The native audio tests and the DeepFilterNet license check; build.yml only builds the example app.
name: Native tests

on:
  push:
    paths:
      - "common/cpp/**"
      - "common/darwin/Classes/CaptureChainProcessing.*"
      - "android/src/main/cpp/**"
      - "ios/flutter_webrtc/Sources/flutter_webrtc/capture_chain/**"
      - "linux/**"
      - "windows/**"
      - "test/native/**"
      - "third_party/**"
      - "web_capture_chain/**"
      - "test/web_capture_chain/**"
      - ".github/workflows/native-tests.yml"
  pull_request:
    paths:
      - "common/cpp/**"
      - "common/darwin/Classes/CaptureChainProcessing.*"
      - "android/src/main/cpp/**"
      - "ios/flutter_webrtc/Sources/flutter_webrtc/capture_chain/**"
      - "linux/**"
      - "windows/**"
      - "test/native/**"
      - "third_party/**"
      - "web_capture_chain/**"
      - "test/web_capture_chain/**"
      - ".github/workflows/native-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Native tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install glib and a D-Bus daemon for the portal guard tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev dbus-daemon

      # NATIVE_TESTS_STRICT makes a skipped test fail, so a missing cargo or bus cannot pass quietly.
      - name: Configure
        run: cmake -S test/native -B build/native-tests -DCMAKE_BUILD_TYPE=Release -DNATIVE_TESTS_STRICT=ON

      - name: Build
        run: cmake --build build/native-tests --parallel 4

      - name: The portal guard tests were built
        run: test -x build/native-tests/portal_guard_tests

      - name: Test
        run: ctest --test-dir build/native-tests --output-on-failure

      - name: Test in a shuffled order
        run: build/native-tests/native_tests --strict --shuffle "$GITHUB_RUN_NUMBER"

  sanitizers:
    name: Native tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan and UBSan
            flags: -fsanitize=address,undefined
          - name: TSan
            flags: -fsanitize=thread
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/test/native/ubsan.supp
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/native/lsan.supp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install glib and a D-Bus daemon for the portal guard tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev dbus-daemon

      - name: Configure
        run: >
          cmake -S test/native -B build/sanitized
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNATIVE_TESTS_STRICT=ON
          "-DCMAKE_C_FLAGS=${{ matrix.flags }} -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }} -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"

      - name: Build
        run: cmake --build build/sanitized --parallel 4

      - name: Test
        run: ctest --test-dir build/sanitized --output-on-failure

  windows:
    name: Native tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        run: cmake -S test/native -B build/native-tests -DNATIVE_TESTS_STRICT=ON

      - name: Build
        run: cmake --build build/native-tests --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build/native-tests -C Release --output-on-failure

  web-capture-chain:
    name: Web capture chain matches its sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The wasm is committed so an app build needs no Emscripten; a stale one would ship old audio code to browsers.
      - name: Rebuild
        run: web_capture_chain/build.sh

      - name: The committed wasm is the one the sources build
        run: git diff --exit-code -- web_capture_chain/capture_chain.wasm

      - name: The worklet drives the wasm the way a browser does
        run: node --test test/web_capture_chain/worklet_test.mjs

  licenses:
    name: DeepFilterNet crate licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: third_party/dfn/Cargo.toml
          # deny.toml sits beside the manifest, where cargo-deny finds it without --config.
          command: check licenses
